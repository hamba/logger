version: "2"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
  exclusions:
    generated: lax

linters:
  default: all
  disable:
    - gocheckcompilerdirectives
    - depguard
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gomodguard
    - interfacebloat
    - ireturn
    - mnd
    - nlreturn
    - nonamedreturns
    - paralleltest
    - testableexamples
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 12
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
                skip-package-name-collision-with-go-std: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - govet
        path: internal/bytes/buffer.go
      - linters:
          - dupl
          - lll
          - goconst
        path: _test\.go
